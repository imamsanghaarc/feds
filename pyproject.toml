[project]
name = "frontend-developer-fte"
version = "0.1.0"
description = "Frontend Developer Digital FTE"
requires-python = ">=3.10"
dependencies = [
  "openai-agents>=0.17.8",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0",
  "psycopg[binary]>=3.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "greenlet>=3.0",
  "pgvector>=0.3",
  "ddgs>=9.16.0",
  "playwright>=1.64.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "jinja2>=3.1.0",
  "ollama>=0.6.3",
]

optional-dependencies = { cli = ["textual>=0.85", "rich>=13.9", "prompt-toolkit>=3.0", "httpx>=0.27", "platformdirs>=4.3"] }

[project.scripts]
feds = "feds_cli.main:main"

[tool.uv]
# The project is now an installable package with CLI entry point.
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["feds_cli*"]
